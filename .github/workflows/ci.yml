# TradePilot CI —— 仓库根工作流（GitHub 只认根 .github/workflows，子树里的
# 首版永远不会被触发，2026-11-01 移到根并适配路径）。
# 后端：pytest 全量（部分测试做真实网络抓取，GitHub runner 有外网；某天若因
# 目标站反爬在 CI 上抖动，再评估是否加重试，不要先加——把抖动藏起来
# 等于掩盖真实问题）。前端：tsc 类型检查 + 构建产物能出。
# 另有 .github/workflows/deploy-modelscope.yml：部署门禁自带 unittest 单测，
# 与本工作流触发面不同（部署只看 push main）。
name: ci

on:
  workflow_dispatch:   # 纯资产类提交（不碰 tradepilot/**）不会自动触发；门禁复核需要当前 sha 有真实 CI 时手动跑
  push:
    branches: [master, main]
    paths:
      - "tradepilot/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "tradepilot/**"
      - ".github/workflows/ci.yml"

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tradepilot
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tradepilot/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Lint (ruff)
        # 质量门禁：规则集见 tradepilot/ruff.toml（与既有风格对齐，只守真问题）
        run: python -m ruff check app tests scripts
      - name: Run test suite with coverage
        # 覆盖率门禁：低于 85% 直接红——基线是读数不是承诺，退化必须被看见
        run: |
          python -m coverage run -m pytest tests -q
          python -m coverage report --include="app/*" --fail-under=85
        env:
          # CI 里不许写用户目录；数据进 runner 临时盘
          TRADEPILOT_DATA_DIR: ${{ runner.temp }}/tradepilot-data

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: tradepilot/web-react
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: tradepilot/web-react/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (eslint)
        run: npm run lint
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
